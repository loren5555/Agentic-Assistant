[project]
name = "agentic-assistant"
version = "0.2.3"
description = "Source-driven personal research assistant with human review"
readme = "README.md"
authors = [
    { name = "loren", email = "loren5555@foxmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbos>=3.2.0",
    "httpx[socks]>=0.28.1",
    "notion-client>=3.1.0",
    "pydantic-ai>=2.51.0",
    "pydantic-ai-harness>=0.36.0",
    "pyyaml>=6.0",
]

[project.scripts]
agentic-assistant = "assistant.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["assistant", "plugins", "logger"]
source-include = ["CHANGELOG.md", "information-flow.drawio"]
source-exclude = ["/src/assistant/config.yaml"]
