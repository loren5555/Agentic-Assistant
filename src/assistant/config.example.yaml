providers:
  memory: local  # Role experience under runtime.directory/v2/memory.
  brainstorm: codex  # Synthesizes research notes and public evidence into an exploration report.
  processors: notion  # Source-specific extraction, acknowledgement and feedback storage.
  organizer: local  # Shared interpretation of source material and human intent.
  reconciler: local  # Deterministic feedback-to-source updates; no model invocation.
  publisher: notion  # Publishes human-accepted typed outcomes.
  direction_proposer: local  # Develops research directions as approved work.
  planner: local  # Designs concrete plans for review before their execution.
  router: local  # Selects the action displayed before proposal approval.
  investigator: local  # Answers questions by investigating public sources.
  proposer: local  # Drafts proposals for individual items.
  workbench: notion  # Stores reports and proposals for human review.
  worker: local  # Completes approved tasks using supplied materials.
  curator: local  # Extracts reusable knowledge from accepted results.
  writer: local  # Writes manuscripts for Papers, Knowledge and accepted research outputs.
  discovery_pool: notion  # Broad discoveries and optional preference feedback.
  feed: notion  # Manages research interests, recommendations, and follow-ups.
  discovery: codex  # Searches live public primary sources using the Codex CLI.
  evidence: codex  # Reads source excerpts and reports access limitations.
  recommender: local  # Evaluates evidence and produces recommendations.

runtime:
  directory: data/assistant
  batch_size: 20
  service:
    port: 8765  # Loopback only; use the same port for serve and CLI clients.
  # The browser saves online edits here. Compact cron strings remain supported.
  # Full form: {cron: "0 0 7 * * *", timezone: Asia/Shanghai, enabled: false}
  schedules:
    recommend-papers-deep: "0 0 7 * * 0"  # Sunday 07:00, Asia/Shanghai.
    recommend-papers-light: "0 0 7 * * 1-6"  # Other six days; same daily edition.
  recommendations:
    # Manage research directions in Notion under Assistant / Recommendation Tags.
    pool_size: 100
    selected_count: 5
    reading_budget: 15
    coverage_days: 90
    ages:
      week: 0.05
      month: 0.15
      quarter: 0.20
      half_year: 0.15
      year: 0.15
      three_years: 0.15
      older: 0.15
    collector:
      deep_provider: codex
      light_provider: local
      deep_weekday: 6
      max_queries: 6
      max_candidates: 40
      context_pool_size: 30
      frontier_days: 90
    exploration:
      Core: 0.4
      Broader: 0.3
      Neighboring: 0.2
      Cross-disciplinary: 0.1

local:
  router_model: openai-codex:gpt-6-luna
  router_effort: low
  timeout_seconds: 120
  proposer_model: openai-codex:gpt-6.1-sol
  # memory_reviewer_model: Defaults to proposer_model for feedback review.
  organizer_model: openai-codex:gpt-6.1-sol
  organizer_effort: low
  organizer_timeout_seconds: 180
  proposer_effort: medium
  proposer_timeout_seconds: 180
  planner_model: openai-codex:gpt-6.2-astra
  planner_effort: high
  planner_timeout_seconds: 180
  worker_model: openai-codex:gpt-6.2-sol
  worker_effort: medium
  worker_timeout_seconds: 180
  worker_toolsets:
    calculator.local: {}  # plugins/execution/tools/calculator/local.py:create_toolset
  curator_model: openai-codex:gpt-6.1-sol
  curator_effort: medium
  curator_timeout_seconds: 180
  investigator_model: openai-codex:gpt-6.2-sol
  investigator_effort: high
  investigator_timeout_seconds: 300
  writer_model: openai-codex:gpt-6.1-sol
  recommendation_model: openai-codex:gpt-6-astra
  writer_effort: medium

codex:
  router_model: gpt-6-luna
  router_effort: low
  timeout_seconds: 120
  executable: codex
  investigator_model: gpt-6.2-sol
  investigator_effort: high
  investigator_timeout_seconds: 300
  brainstorm_model: gpt-6.2-astra
  brainstorm_effort: high
  brainstorm_timeout_seconds: 600
  experiment_model: gpt-6.2-astra
  experiment_effort: high
  experiment_timeout_seconds: 3600
  discovery_model: gpt-6-astra
  discovery_effort: high
  discovery_timeout_seconds: 600
  discovery_max_candidates: 60
  discovery_recent_days: 7
  evidence_model: gpt-6.1-sol
  evidence_effort: medium
  evidence_timeout_seconds: 180

notion:
  assistant_page_id: <<notion-assistant-page-id>>
  recommendation_tags_data_source_id: ""  # Optional. Setup locates or creates Recommendation Tags under Assistant.
  discovery_pool_data_source_id: <<notion-discovery-pool-data-source-id>>
  token: <<notion-token>>
  inbox_data_source_id: <<notion-inbox-data-source-id>>
  todo_data_source_id: <<notion-todo-data-source-id>>
  workbench_data_source_id: <<notion-workbench-data-source-id>>
  knowledge_data_source_id: <<notion-knowledge-data-source-id>>
  sparks_data_source_id: ""  # Setup locates or creates Sparks under Assistant.
  ideas_data_source_id: <<notion-ideas-data-source-id>>
  notero_data_source_id: <<notion-notero-data-source-id>>
  simpread_data_source_id: <<notion-simpread-data-source-id>>
  papers_data_source_id: <<notion-papers-data-source-id>>
  research_interests_data_source_id: <<notion-research-interests-data-source-id>>
  research_feed_data_source_id: <<notion-research-feed-data-source-id>>

# API v2 public papers/discussions only. Configure credentials in the host environment
# if public queries require login; API account access does not broaden collection scope.
openreview:
  venues: []  # Optional exact venue IDs; empty allows all public matching venues.
  page_size: 50
  max_pages: 3
  max_discussions: 40
  timeout_seconds: 30
  interval_seconds: 1
  username_env: OPENREVIEW_USERNAME
  password_env: OPENREVIEW_PASSWORD

# The local key enables rec5 and the reviewed literature route.
aminer:
  api_key: ""
  timeout_seconds: 600  # Hosted deep research request timeout.
