providers:
  processors: notion  # Source-specific extraction, acknowledgement and feedback storage.
  organizer: local  # Shared interpretation of source material and human intent.
  reconciler: local  # Deterministic feedback-to-source updates; no model invocation.
  publisher: notion  # Publishes human-accepted typed outcomes.
  direction_proposer: local  # Develops research directions as approved work.
  planner: local  # Designs concrete plans for review before their execution.
  router: local  # Selects the action displayed before proposal approval.
  investigator: local  # Answers questions by investigating public sources.
  proposer: local  # Drafts proposals for individual items.
  workbench: notion  # Stores reports and proposals for human review.
  worker: local  # Completes approved tasks using supplied materials.
  curator: local  # Extracts reusable knowledge from accepted results.
  briefs: local  # Organizes captured material into grounded briefs.
  discovery_pool: notion  # Broad discoveries and optional preference feedback.
  feed: notion  # Manages research interests, recommendations, and follow-ups.
  discovery: codex  # Searches live public primary sources using the Codex CLI.
  evidence: codex  # Reads source excerpts and reports access limitations.
  recommender: local  # Evaluates evidence and produces recommendations.

runtime:
  directory: data/assistant
  batch_size: 20
  schedules: {}
  recommendations:
    topics:
    - Reinforcement learning
    - Decision making
    - Multi-agent systems
    pool_size: 100
    selected_count: 5
    reading_budget: 15
    exploration:
      Core: 0.4
      Broader: 0.3
      Neighboring: 0.2
      Cross-disciplinary: 0.1

local:
  router_model: openai-codex:gpt-5.6-luna
  router_effort: low
  timeout_seconds: 120
  proposer_model: openai-codex:gpt-5.6-luna
  organizer_model: openai-codex:gpt-5.6-luna
  organizer_effort: low
  organizer_timeout_seconds: 180
  proposer_effort: medium
  proposer_timeout_seconds: 180
  planner_model: openai-codex:gpt-5.6-luna
  planner_effort: medium
  planner_timeout_seconds: 180
  worker_model: openai-codex:gpt-5.6-luna
  worker_effort: low
  worker_timeout_seconds: 180
  worker_toolsets:
    calculator.local: {}  # plugins/execution/tools/calculator/local.py:create_toolset
  curator_model: openai-codex:gpt-5.6-luna
  curator_effort: low
  curator_timeout_seconds: 180
  investigator_model: openai-codex:gpt-5.6-luna
  investigator_effort: medium
  investigator_timeout_seconds: 300
  brief_model: openai-codex:gpt-5.6-luna
  recommendation_model: openai-codex:gpt-5.6-luna

codex:
  router_model: gpt-5.6-luna
  router_effort: low
  timeout_seconds: 120
  executable: codex
  investigator_model: gpt-5.6-luna
  investigator_effort: low
  investigator_timeout_seconds: 300
  discovery_model: gpt-5.6-luna
  discovery_effort: low
  discovery_timeout_seconds: 600
  discovery_max_candidates: 60
  discovery_recent_days: 7
  evidence_model: gpt-5.6-luna
  evidence_effort: low
  evidence_timeout_seconds: 180

notion:
  assistant_page_id: <<notion-assistant-page-id>>
  discovery_pool_data_source_id: <<notion-discovery-pool-data-source-id>>
  token: <<notion-token>>
  inbox_data_source_id: <<notion-inbox-data-source-id>>
  todo_data_source_id: <<notion-todo-data-source-id>>
  workbench_data_source_id: <<notion-workbench-data-source-id>>
  knowledge_data_source_id: <<notion-knowledge-data-source-id>>
  ideas_data_source_id: <<notion-ideas-data-source-id>>
  notero_data_source_id: <<notion-notero-data-source-id>>
  simpread_data_source_id: <<notion-simpread-data-source-id>>
  papers_data_source_id: <<notion-papers-data-source-id>>
  research_interests_data_source_id: <<notion-research-interests-data-source-id>>
  research_feed_data_source_id: <<notion-research-feed-data-source-id>>
